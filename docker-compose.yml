services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink
    restart: unless-stopped
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml:ro
      - ./plugins:/opt/Lavalink/plugins
    ports:
      - "2333:2333"   # Expose only if you need external access; remove if bot-only
    networks:
      - music

  # Generates YouTube poTokens (proof-of-origin tokens) used by the youtube-source
  # Lavalink plugin to reduce "Sign in to confirm you're not a bot" errors.
  potoken-generator:
    image: quay.io/invidious/youtube-trusted-session-generator:webserver
    container_name: potoken-generator
    restart: unless-stopped
    ports:
      - "8090:8080"   # Published so the bot can reach it even when run outside Docker (via localhost:8090)
    networks:
      - music

  bot:
    build: .
    container_name: ayeyodj
    restart: unless-stopped
    env_file: .env
    depends_on:
      - lavalink
      - potoken-generator
    volumes:
      - ./jingles:/app/jingles
    ports:
      - "8765:8765"
    networks:
      - music

networks:
  music:
    driver: bridge
