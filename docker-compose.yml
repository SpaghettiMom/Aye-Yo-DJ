services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink
    restart: unless-stopped
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml:ro
      - ./plugins:/opt/Lavalink/plugins
    ports:
      - "2333:2333"   # Expose only if you need external access; remove if bot-only
    networks:
      - music

  # Generates YouTube poTokens (proof-of-origin tokens) used by the youtube-source
  # Lavalink plugin to reduce "Sign in to confirm you're not a bot" errors.
  # NOTE (Aug 2026): switched from iv-org/youtube-trusted-session-generator (dead
  # upstream — YouTube changed BotGuard handling, tool permanently times out) to
  # Brainicism/bgutil-ytdlp-pot-provider, which is actively maintained and uses a
  # working BotGuard implementation (LuanRT/BgUtils). API shape differs — see
  # bot.py's refresh_potoken_task (POST /get_pot instead of GET /token).
  potoken-generator:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: potoken-generator
    restart: unless-stopped
    ports:
      - "8090:4416"   # Published so the bot can reach it even when run outside Docker (via localhost:8090)
    networks:
      - music

  bot:
    build: .
    container_name: ayeyodj
    restart: unless-stopped
    env_file: .env
    depends_on:
      - lavalink
      - potoken-generator
    volumes:
      - ./jingles:/app/jingles
    ports:
      - "8765:8765"
    networks:
      - music

networks:
  music:
    driver: bridge
