services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink
    restart: unless-stopped
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml:ro
      - ./plugins:/opt/Lavalink/plugins
    ports:
      - "2333:2333"   # Expose only if you need external access; remove if bot-only
    networks:
      - music

  # Remote cipher service used by youtube-source to resolve signature extraction
  # when YouTube player scripts change faster than local extraction logic.
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: yt-cipher
    restart: unless-stopped
    environment:
      - OVERRIDE_PLAYER_VARIANT=IAS
    ports:
      - "8001:8001"
    networks:
      - music

  bot:
    build: .
    container_name: ayeyodj
    restart: unless-stopped
    env_file: .env
    depends_on:
      - lavalink
      - yt-cipher
    volumes:
      - ./jingles:/app/jingles
    ports:
      - "8765:8765"
    networks:
      - music

networks:
  music:
    driver: bridge
