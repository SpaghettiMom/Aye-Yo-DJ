server:
  port: 2333
  address: 0.0.0.0  # Listen on all interfaces so remote clients can connect

lavalink:
  server:
    password: "youshallnotpass"
    sources:
      youtube: false  # Disabled — handled by the youtube-source plugin below
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
      - MWEB
      - TVHTML5_SIMPLY
      - TV
    # OAuth lets youtube-source authenticate as a real signed-in account, which is
    # the only mechanism with real age/login-restriction bypass (also required for
    # the TV client above). On first Lavalink start with no refreshToken below, watch
    # the logs for a https://www.google.com/device link + code — open it once with a
    # burner Google account, then paste the printed refreshToken here so future
    # restarts skip the login flow.
    oauth:
      enabled: true
      # refreshToken: "paste your refresh token here once you have one"
    # poToken ("Proof of Origin Token") for the WEB/WEBEMBEDDED clients.
    # Not needed when using OAuth, left inert as a harmless fallback. The bot
    # refreshes these automatically at runtime via Lavalink's REST API
    # (POST /youtube) using the potoken-generator service
    # (Brainicism/bgutil-ytdlp-pot-provider). See docker-compose.yml
    # (potoken-generator) and bot.py (refresh_potoken_task).
    pot:
      token: ""
      visitorData: ""
    
metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
