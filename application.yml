server:
  port: 2333
  address: 0.0.0.0  # Listen on all interfaces so remote clients can connect

lavalink:
  server:
    password: "youshallnotpass"
    sources:
      youtube: false  # Disabled — handled by the youtube-source plugin below
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177"
      snapshot: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - TV
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    # OAuth lets youtube-source authenticate as a real signed-in account, which is
    # the only mechanism with real age/login-restriction bypass (also required for
    # the TV client above).
    oauth:
      enabled: true
      refreshToken: ""
    # Remote cipher server handles signature/n-param deciphering when YouTube's
    # player scripts change faster than local extraction logic can keep up.
    # See docker-compose.yml (yt-cipher service, kikkia/yt-cipher).
    remoteCipher:
      url: "http://host.docker.internal:8001"

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
